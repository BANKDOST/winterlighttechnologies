  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0 40px;
    overflow-x: hidden;
  }

  /* Background Ambient Blobs */
  .blob {
    position: fixed;
    filter: blur(90px);
    z-index: -1;
    opacity: 0.5;
  }
  .blob1 { width: 350px; height: 350px; background: #eab308; top: -100px; left: -100px; border-radius: 50%; }

  .container {
    width: 100%;

    text-align: center;

  }

  /* Top Navigation / Home Button */
  .top-nav {
    display: flex;
    justify-content: flex-start;
    margin-bottom: 20px;
    width: 100%;
  }

    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #cbd5e1;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    background: rgba(255, 255, 255, 0.05);
    padding: 8px 16px;
    border-radius: 50px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background 0.2s, color 0.2s;
  }
  
  .home-btn:hover, .home-btn:active {
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
  }
  
  /* Glassmorphism Card */
  .glass-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 32px;
    padding: 40px 25px 30px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
  }

  /* App Icon */
  .app-icon {
    width: 110px;
    height: 110px;
    border-radius: 24px;
    margin: 0 auto 15px;
    box-shadow: 0 15px 35px rgba(234, 179, 8, 0.25); 
    border: 2px solid rgba(234, 179, 8, 0.4);
    object-fit: cover;
  }

  h1 { 
    font-size: 2rem; 
    margin: 0 0 5px; 
    color: #f8fafc;
    letter-spacing: -0.5px;
  }
  
  h2 {

    margin: 0 0 25px; 
    color: #94a3b8; 
    font-weight: 400; 
  }

  .screenshot-container {
    display: flex;
    overflow-x: auto;
    gap: 15px;
    padding: 10px 5px 25px;
    margin-bottom: 10px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }
  
  /* Hide Scrollbar for cleaner UI */
  .screenshot-container::-webkit-scrollbar { display: none; }
  .screenshot-container { -ms-overflow-style: none; scrollbar-width: none; }

  .screenshot-container img {
    height: 320px;
    border-radius: 16px;
    scroll-snap-align: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.05);
  }

  .play-badge {
    display: block;
    width: 200px;

    transition: transform 0.2s;
